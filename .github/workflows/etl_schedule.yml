name: Daily Weather ETL Pipeline

on:
  schedule:
    - cron: "0 0 * * *" # Runs automatically every day at 00:00 UTC (8:00 AM PHT)
  workflow_dispatch: # Allows you to trigger a manual run anytime from GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create GCP Service Account key file
        run: echo '${{ secrets.GCP_KEY_JSON }}' > gcp-key.json

      - name: Run Weather ETL Pipeline
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
          BQ_TABLE: ${{ secrets.BQ_TABLE }}
          GOOGLE_APPLICATION_CREDENTIALS: gcp-key.json
        run: python main.py

      - name: Clean up key file
        if: always()
        run: rm -f gcp-key.json
